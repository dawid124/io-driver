[env:pico]
platform = https://github.com/maxgerhardt/platform-raspberrypi.git
board = pico
framework = arduino
board_build.core = earlephilhower
upload_port = /Volumes/RPI-RP2
board_build.filesystem_size = 0.5m
lib_ignore = Adafruit TinyUSB Library
; note that download link for toolchain is specific for OS. see https://github.com/earlephilhower/pico-quick-toolchain/releases.
platform_packages =
    maxgerhardt/framework-arduinopico@https://github.com/earlephilhower/arduino-pico.git
    maxgerhardt/toolchain-pico@https://github.com/earlephilhower/pico-quick-toolchain/releases/download/1.3.1-a/x86_64-w64-mingw32.arm-none-eabi-7855b0c.210706.zip

lib_deps =
    EthernetENC@~2.0.0
;    khoih.prog/EthernetWebServer @ 1.5.0
    knolleary/PubSubClient @ 2.8
;    interactive-matter/aJson

    kitesurfer1404/WS2812FX@^1.3.5
    sparkfun/SparkFun SX1509 IO Expander @ 2.0.0

    adafruit/Adafruit NeoPixel@^1.10.4
    contrem/arduino-timer@^2.3.1

build_flags =
;    -DDEBUG_RP2040_WIRE
;    -DDEBUG_RP2040_SPI
;    -DDEBUG_RP2040_CORE
;    -DDEBUG_RP2040_PORT=Serial
    -DDEVICE_NAME=IO-DRIVER-F1-0
;    -DMQTT_SERVER=192.168.0.100


[env:pico2]
