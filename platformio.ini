[env:pico]
platform = https://github.com/maxgerhardt/platform-raspberrypi.git
board = pico
framework = arduino
board_build.core = earlephilhower
;upload_port = /Volumes/RPI-RP2
upload_port = COM12
monitor_port = COM12
monitor_speed = 115200
board_build.filesystem_size = 1m
board_build.f_cpu = 133000000L
;lib_ignore = Adafruit TinyUSB Library

lib_deps =
    EthernetENC@~2.0.3
    knolleary/PubSubClient @ 2.8
    bblanchon/ArduinoJson@^6.19.4

;    adafruit/Adafruit BusIO@^1.13.2

    sparkfun/SX1509 IO Expander@^3.0.0

    adafruit/Adafruit NeoPixel@^1.10.5
;    kitesurfer1404/WS2812FX@^1.4.1
;    contrem/arduino-timer@^2.3.1

;lib_ldf_mode = chain+


build_flags =
;    -DDEBUG_RP2040_WIRE
;    -DDEBUG_RP2040_SPI
;    -DDEBUG_RP2040_CORE
;    -DDEBUG_RP2040_PORT=Serial

    -DUSE_TINYUSB
    -DPIO_FRAMEWORK_ARDUINO_ENABLE_EXCEPTIONS
    -fstack-protector
    -DPIO_FRAMEWORK_ARDUINO_ENABLE_RTTI
;    -DPIO_FRAMEWORK_ARDUINO_NO_USB
    -D MQTT_MAX_PACKET_SIZE=4048
    -fexceptions

    -D MQTT_SERVER="192.168.0.100"
    -D MQTT_SYNC_TOPIC="home/driver-sync"
    -D MQTT_ACTION_TOPIC="home/actions"
    -D MQTT_TRIGGER_TOPIC="home/triggers"

;    -D DEVICE_IP="192.168.0.110"

;    -D DEVICE_NAME="IO-DRIVER-F1-0"
;    -D DEVICE_MAC="90-A2-AF-DA-14-10"

    -D DEVICE_NAME="IO-DRIVER-F1-1"
    -D DEVICE_MAC="90-A2-AF-DA-14-11"

;    -D DEVICE_NAME="IO-DRIVER-F1-2"
;    -D DEVICE_MAC="90-A2-AF-DA-14-12"

;    -D DEVICE_NAME="IO-DRIVER-TEST"
;    -D DEVICE_MAC="90-A2-AF-DA-14-12"


;    -D DEVICE_NAME="IO-DRIVER-F0-0"
;    -D DEVICE_MAC="90-A2-AF-DA-14-13"

;    -D DEVICE_NAME="IO-DRIVER-F2-0"
;    -D DEVICE_MAC="90-A2-AF-DA-14-14"
