[env:pico]
platform = https://github.com/maxgerhardt/platform-raspberrypi.git
board = pico
framework = arduino
board_build.core = earlephilhower
upload_port = /Volumes/RPI-RP2
board_build.filesystem_size = 0.5m
lib_ignore = Adafruit TinyUSB Library
; note that download link for toolchain is specific for OS. see https://github.com/earlephilhower/pico-quick-toolchain/releases.
platform_packages =
    maxgerhardt/framework-arduinopico@https://github.com/earlephilhower/arduino-pico.git
    maxgerhardt/toolchain-pico@https://github.com/earlephilhower/pico-quick-toolchain/releases/download/1.3.1-a/x86_64-w64-mingw32.arm-none-eabi-7855b0c.210706.zip

lib_deps =
    EthernetENC@~2.0.0
    knolleary/PubSubClient @ 2.8
    bblanchon/ArduinoJson@^6.19.2

    kitesurfer1404/WS2812FX@^1.3.5
    sparkfun/SparkFun SX1509 IO Expander @ 2.0.0

    adafruit/Adafruit NeoPixel@^1.10.4
    contrem/arduino-timer@^2.3.1

build_flags =
;    -DDEBUG_RP2040_WIRE
;    -DDEBUG_RP2040_SPI
;    -DDEBUG_RP2040_CORE
;    -DDEBUG_RP2040_PORT=Serial

    -fexceptions
    -D MQTT_MAX_PACKET_SIZE=5120

    -D DEVICE_NAME="IO-DRIVER-F1-0"
    -D DEVICE_IP="192.168.0.110"
    -D DEVICE_MAC="90-A2-AF-DA-14-10"

;    -D DEVICE_NAME="IO-DRIVER-F1-1"
;    -D DEVICE_IP="192.168.0.103"
;    -D DEVICE_MAC="90-A2-AF-DA-14-12"

    -D MQTT_SERVER="192.168.0.100"
    -D MQTT_ACTION_TOPIC="home/actions"
    -D MQTT_TRIGGER_TOPIC="home/triggers"

build_unflags =
    -fno-exceptions